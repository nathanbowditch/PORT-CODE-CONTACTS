<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTCODE</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }
    header { margin-bottom: 16px; text-align: center; }
    h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 1px; }
    .dev { font-size: 0.8rem; color: var(--subtext); margin-top: 2px; }
    .top-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: var(--text); font-size: 1rem; }
    button { padding: 12px 16px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg); font-weight: bold; cursor: pointer; }
    .port-card { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
    .port-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .unlocode { display: inline-block; background: #0284c7; color: white; font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; margin: 6px 0 12px 0; }
    .details { display: none; margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px; font-size: 0.95rem; }
    .details p { margin-bottom: 6px; }
    .details strong { color: var(--subtext); display: inline-block; width: 140px; }
    .status { font-size: 0.8rem; color: var(--subtext); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>PORTCODE</h1>
    <div class="dev">Developer: DEATHWYLER</div>
  </header>

  <div class="top-bar">
    <input type="text" id="searchInput" placeholder="Search port name or UNLOCODE..." onkeyup="filterPorts()">
    <button onclick="checkForUpdates()">Update</button>
  </div>

  <div id="portList"></div>
  <div class="status" id="statusText">Loaded from local storage (Offline Ready)</div>

  <script>
    // Initial local dataset
    const defaultPorts = [
      {
        name: "Port of Manila",
        unlocode: "PH MNL",
        pfso: "+63 2 8527 8356",
        fire: "160 or +63 2 8527 3627",
        ambulance: "911",
        coastguard: "+63 2 8529 5183"
      },
      {
        name: "Port of Batangas",
        unlocode: "PH BTG",
        pfso: "+63 43 723 0164",
        fire: "160 or +63 43 723 1505",
        ambulance: "911",
        coastguard: "+63 43 723 4186"
      },
      {
        name: "Port of Cebu",
        unlocode: "PH CEB",
        pfso: "+63 32 232 1461",
        fire: "160 or +63 32 256 0541",
        ambulance: "911",
        coastguard: "+63 32 412 9468"
      }
    ];

    // Load ports from localStorage if available, otherwise use defaults
    function getPorts() {
      const stored = localStorage.getItem('PORTCODE_DATA');
      return stored ? JSON.parse(stored) : defaultPorts;
    }

    function renderPorts(portsToRender) {
      const listContainer = document.getElementById('portList');
      listContainer.innerHTML = '';

      portsToRender.forEach((port, index) => {
        const card = document.createElement('div');
        card.className = 'port-card';
        card.onclick = () => toggleDetails(index);
        
        card.innerHTML = `
          <div class="port-title">${port.name}</div>
          <div class="unlocode">UNLOCODE: ${port.unlocode}</div>
          <div class="details" id="details-${index}">
            <p><strong>PFSO:</strong> ${port.pfso}</p>
            <p><strong>Fire Dept:</strong> ${port.fire}</p>
            <p><strong>Ambulance:</strong> ${port.ambulance}</p>
            <p><strong>Coast Guard:</strong> ${port.coastguard}</p>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function toggleDetails(index) {
      const target = document.getElementById(`details-${index}`);
      const isVisible = target.style.display === 'block';
      
      // Collapse all
      document.querySelectorAll('.details').forEach(d => d.style.display = 'none');
      
      // Auto show clicked port UNLOCODE and details
      if (!isVisible) {
        target.style.display = 'block';
      }
    }

    function filterPorts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const allPorts = getPorts();
      const filtered = allPorts.filter(p => 
        p.name.toLowerCase().includes(query) || 
        p.unlocode.toLowerCase().includes(query)
      );
      renderPorts(filtered);
    }

    // Remote sync function to fetch online updates
    async function checkForUpdates() {
      const status = document.getElementById('statusText');
      status.innerText = "Checking for updates online...";
      
      try {
        // Point this to a raw JSON file hosted on GitHub or your server
        const response = await fetch('https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/PORTCODE/main/ports.json');
        if (response.ok) {
          const freshData = await response.json();
          localStorage.setItem('PORTCODE_DATA', JSON.stringify(freshData));
          renderPorts(freshData);
          status.innerText = "Updated successfully! Cached for offline use.";
        } else {
          status.innerText = "No online updates found. Using cached data.";
        }
      } catch (err) {
        status.innerText = "Offline mode active or network error. Using cached data.";
      }
    }

    // Initial render
    renderPorts(getPorts());
  </script>
</body>
</html>
