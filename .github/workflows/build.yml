name: Build PORTCODE APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable GitHub Pages & Copy App
        run: |
          mkdir public
          cp index.html public/
          
      - name: Build WebAPK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/index.html || true

      - name: Create Native APK via Android Gradle
        run: |
          mkdir -p android_app
          cd android_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PORTCODE" "com.deathwyler.portcode" --web-dir ../public
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PORTCODE-DEATHWYLER-APK
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
