name: Build PORTCODE APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Ionic/Capacitor App Project
        run: |
          mkdir build_dir
          cp index.html build_dir/
          npm install -g @ionic/cli
          ionic start temp_app blank --type=angular --no-interactive --no-git --link=false
          cd temp_app
          rm -rf src/app/*
          mkdir -p www
          cp ../index.html www/index.html
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd temp_app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PORTCODE-DEATHWYLER-APK
          path: temp_app/android/app/build/outputs/apk/debug/app-debug.apk
