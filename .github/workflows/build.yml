name: Build PORTCODE APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android App Project
        run: |
          npm install -g cordova
          cordova create portapp com.deathwyler.portcode PORTCODE
          cp index.html portapp/www/index.html
          cd portapp
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PORTCODE-DEATHWYLER-APK
          path: portapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
