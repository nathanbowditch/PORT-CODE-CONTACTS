<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTCODE</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { color: #38bdf8; margin: 0; font-size: 26px; }
    .header .dev { color: #94a3b8; font-size: 12px; font-weight: bold; margin-top: 4px; }
    .search-box { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: 2px solid #38bdf8; background: #1e293b; color: white; outline: none; }
    .card { background: #1e293b; border-radius: 10px; padding: 15px; margin-top: 12px; border-left: 5px solid #38bdf8; }
    .card h3 { margin: 0 0 8px 0; color: #38bdf8; }
    .info { margin: 6px 0; font-size: 14px; color: #cbd5e1; }
    .tag { font-weight: bold; color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚢 PORTCODE</h1>
    <div class="dev">DEVELOPER: DEATHWYLER</div>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Search Port Name or UNLOCODE..." onkeyup="searchPort()">

  <div id="results"></div>

  <script>
    const ports = [
      { name: "Port of Manila", unlocode: "PH MNL", fire: "+63 2 8527 3627", amb: "+63 2 8527 8481", cg: "+63 2 8527 8481" },
      { name: "Port of Batangas", unlocode: "PH BTG", fire: "+63 43 723 1513", amb: "+63 43 723 2025", cg: "+63 43 723 8243" },
      { name: "Port of Cebu", unlocode: "PH CEB", fire: "+63 32 256 0541", amb: "+63 32 255 0110", cg: "+63 32 412 9291" },
      { name: "Port of Singapore", unlocode: "SG SIN", fire: "+65 995", amb: "+65 995", cg: "+65 6325 2488" },
      { name: "Port of Rotterdam", unlocode: "NL RTM", fire: "+31 112", amb: "+31 112", cg: "+31 900 0112" }
    ];

    function searchPort() {
      let q = document.getElementById('searchInput').value.toLowerCase().trim();
      let res = document.getElementById('results');
      res.innerHTML = "";
      if (!q) return;

      let match = ports.filter(p => p.name.toLowerCase().includes(q) || p.unlocode.toLowerCase().includes(q));

      match.forEach(p => {
        res.innerHTML += `
          <div class="card">
            <h3>${p.name}</h3>
            <div class="info"><b>UNLOCODE:</b> ${p.unlocode}</div>
            <div class="info"><span class="tag">🚒 Fire Dept:</span> ${p.fire}</div>
            <div class="info"><span class="tag">🚑 Ambulance:</span> ${p.amb}</div>
            <div class="info"><span class="tag">⚓ Coast Guard:</span> ${p.cg}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
